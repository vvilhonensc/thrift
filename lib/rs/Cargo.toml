[package]
name = "thrift"
description = "Rust bindings for the Apache Thrift RPC system"
edition = "2024"
version = "0.26.0"
license = "Apache-2.0"
authors = ["Apache Thrift Developers <dev@thrift.apache.org>"]
homepage = "http://thrift.apache.org"
documentation = "https://docs.rs/thrift"
repository = "https://github.com/apache/thrift/tree/master/lib/rs"
readme = "README.md"
exclude = ["Makefile*", "test/**", "*.iml"]
keywords = ["thrift"]

[dependencies]
byteorder = "1.5"
uuid = "1"
log = { version = "0.4", optional = true }
ordered-float = { version = "5", features = ["serde"] }
threadpool = { version = "1.7", optional = true }
rustls = { version = "0.23.42", default-features = false, features = ["std", "tls12"], optional = true }
varint-rs = "2.2.1"

[features]
default = ["server"]
server = ["threadpool", "log"]
rustls = ["dep:rustls"]

[dev-dependencies]
criterion = "0.7.0"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }

[[bench]]
name = "binary_protocol"
harness = false
